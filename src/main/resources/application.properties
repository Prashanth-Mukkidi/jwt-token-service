# Server Port (Set to 8081 to avoid conflict with other services running on 8080)
server.port=8081

# JWT Configuration
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
# Expiration in milliseconds: 86400000 ms = 24 hours
jwt.expiration=86400000

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:jwttokengen_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Show SQL in console logs
spring.jpa.show-sql=true

# H2 Web Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize DB
spring.sql.init.mode=always
